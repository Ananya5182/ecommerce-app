<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVault | Modern E-Commerce</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #10b981;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Navbar */
    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-size: 1.5rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--primary); }

    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .cart-btn:hover { background: var(--primary-hover); }
    .cart-badge { background: #ef4444; color: white; padding: 2px 7px; border-radius: 999px; font-size: 0.75rem; }

    /* Layout */
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .hero { text-align: center; margin-bottom: 3rem; }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    .hero p { color: var(--text-muted); font-size: 1.1rem; }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }

    .product-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #334155;
    }

    .product-info { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .product-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.4rem; }
    .product-category { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .product-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    
    .add-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-btn:hover { background: var(--primary); }

    /* Slide-out Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: var(--card-bg);
      border-left: 1px solid var(--border);
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease-in-out;
      padding: 1.5rem;
    }
    .cart-drawer.open { right: 0; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    
    .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 0.75rem; border-radius: 6px; }
    .cart-footer { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; }
    .checkout-btn { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 0.8rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .checkout-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <div class="brand">Tech<span>Vault</span></div>
    <button class="cart-btn" onclick="toggleCart()">
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Premium Gear Catalog</h1>
      <p>Continuous Integration & Agile Delivered Demo Store</p>
    </div>
    <div class="product-grid" id="product-list"></div>
  </div>

  <!-- Cart Sidebar Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>Shopping Cart</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total:</span>
        <span id="cart-total" style="color: var(--accent);">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Checkout Order</button>
    </div>
  </div>

  <script>
    let cart = [];

    // Fetch and render products
    fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        const list = document.getElementById('product-list');
        list.innerHTML = products.map(p => `
          <div class="product-card">
            <img class="product-img" src="${p.image}" alt="${p.name}">
            <div class="product-info">
              <div class="product-category">${p.category}</div>
              <h3 class="product-title">${p.name}</h3>
              <div class="product-bottom">
                <span class="price">$${p.price.toFixed(2)}</span>
                <button class="add-btn" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">+ Add</button>
              </div>
            </div>
          </div>
        `).join('');
      });

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
    }

    function addToCart(id, name, price) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, name, price, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;

      const itemsContainer = document.getElementById('cart-items');
      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>';
        return;
      }

      itemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div style="font-weight: 600;">${item.name}</div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">$${item.price.toFixed(2)} &times; ${item.qty}</div>
          </div>
          <span style="font-weight: 700; color: var(--accent);">$${(item.price * item.qty).toFixed(2)}</span>
        </div>
      `).join('');
    }

    function checkout() {
      if (cart.length === 0) {
        alert('Your cart is empty!');
        return;
      }
      alert('Order Placed Successfully! (Demo Agile Feature)');
      cart = [];
      renderCart();
      toggleCart();
    }
  </script>
</body>
</html>
